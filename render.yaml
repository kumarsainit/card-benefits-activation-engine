# Render Infrastructure Blueprint for Card Benefits Activation Engine
version: "1"

databases:
  - name: cbae-postgres
    databaseName: card_benefits_db
    user: card_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # Spring Boot Java 21 Backend Service
  - type: web
    name: cbae-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: cbae-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://cbae-frontend.onrender.com,https://card-benefits-activation-engine.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: APP_KAFKA_ENABLED
        value: "false"

  # Next.js 14 Frontend Service
  - type: web
    name: cbae-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: cbae-backend
          property: host
          value: https://cbae-backend.onrender.com/api/v1
      - key: NODE_ENV
        value: production
